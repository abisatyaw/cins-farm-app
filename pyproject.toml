[project]
name = "cins-farm-app"
version = "0.1.0"
description = "Bookkeeping and flock management for a single egg farm"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "openpyxl>=3.1,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "ty>=0.0.1"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.ty.src]
include = ["backend/app"]
[tool.ty.environment]
extra-paths = ["backend"]
